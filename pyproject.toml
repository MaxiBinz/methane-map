[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methane-hunter"
version = "0.1.0"
description = "Reproducible, conservative screening of real EMIT methane observations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3", "pandas>=2,<3", "rasterio>=1.4,<2",
  "scipy>=1.14,<2", "matplotlib>=3.9,<4", "shapely>=2,<3",
  "pyproj>=3.6,<4", "requests>=2.32,<3",
]

[project.optional-dependencies]
earthdata = ["earthaccess>=0.14", "xarray>=2024", "h5netcdf>=1.3", "h5py>=3"]
test = ["pytest>=8,<9"]

[project.scripts]
methane-hunter = "methane_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

